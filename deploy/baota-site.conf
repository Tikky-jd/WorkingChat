# =====================================================================
# 协作台 · 宝塔站点 Nginx 配置片段（反代 + 静态托管）
# ---------------------------------------------------------------------
# 适用：宝塔面板已建好站点、已申请 Let's Encrypt 证书并开启「强制 HTTPS」。
# 作用：Nginx 在 443 做 HTTPS 终端；静态页直接从 public/ 发；
#       仅把 /api/ 与 /uploads/ 反代到本地 node（http://127.0.0.1:3000）。
#       这样 node 不碰证书、不处理 HTTPS，证书续期全交给宝塔。
#
# 用法（二选一）：
#   A. 宝塔 UI：站点 → 反向代理 → 添加反向代理（目标 http://127.0.0.1:3000，
#      代理目录填 /api/），再手动补 /uploads/ 反代（见下）。
#   B.（推荐，最稳）直接编辑站点「配置文件」：把 root 指向 public、
#      在原有的 location / { 之前插入下面两段 location。
# =====================================================================
#
# ⚠️ 头像/图片 404 的最常见原因（排查顺序）：
#   1. 宝塔「反向代理」UI 里只代理了 /api/，没有把 /uploads/ 也代理出去。
#      → 浏览器请求 /uploads/xxx.png 时，nginx 把它当「站点静态文件」去
#        public/uploads/ 找（那里没有），于是返回 404。
#      → 解决方案：务必让 /uploads/ 也反代到 127.0.0.1:3000（见下面第二段）。
#   2. 宝塔在 location / 里加了 try_files $uri ... 之类逻辑，/uploads/ 被优先当
#      本地静态、反代没生效。→ 确保 /uploads/ 的 location 写在 location / 之前。
#   3. 验证：服务器上执行  curl -I http://127.0.0.1:3000/uploads/头像文件名
#      若 node 直连 200、外网域名 404，则 100% 是 nginx 反代问题（非代码）。
# =====================================================================

# ---- 若宝塔站点根目录不是 public，先改 root（一般在 server 段顶部）----
# root    /www/wwwroot/office-chat/public;
# index   index.html index.htm;

# ---- 在原有 `location / {` 之前插入以下内容 ----

    # 上传大文件（图片单条 ≤100MB，预留余量）
    client_max_body_size 140m;

    # API 反代到本地 node
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        # SSE 实时推送必须关缓冲 + HTTP/1.1（否则消息被 Nginx 攒着不推）
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 图片上传反代到本地 node（node 从 data/uploads 读取）
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

# ---- 原 location / { 保留，用于托管 public/ 下的静态文件 ----
#     注意：不要给 location / 加 proxy_pass，否则静态页会被转发到 node。
#     /.well-known/ 由宝塔自建用于证书验证，不要代理，保持从 root 读取。
